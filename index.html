<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090B" />
  <title>NAMU — AI Artists & DJs Music Platform</title>
  <link rel="manifest" href="./public/manifest.json" />
  <link rel="icon" type="image/png" href="./public/namu-logo.png" />
  <link rel="apple-touch-icon" href="./public/namu-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090B;
      --surface: #121216;
      --surface-2: #18181D;
      --border: rgba(255, 30, 110, 0.24);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent: #FF1E6E;
      --accent-soft: rgba(255, 30, 110, 0.14);
      --accent-glow: 0 0 18px rgba(255, 30, 110, 0.45);
      --text: #F4F4F6;
      --text-muted: #9A9AA6;
      --ok: #22C55E;
      --warn: #F59E0B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      overflow-x: hidden;
      min-height: 100dvh;
    }

    h1, h2, h3, .brand-title {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      letter-spacing: -0.02em;
    }

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      padding-bottom: 158px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(9, 9, 11, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo-ring {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      box-shadow: var(--accent-glow);
      display: grid;
      place-items: center;
      background: #050507;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    .env-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--border);
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-upload-top {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-upload-top:active { transform: scale(0.97); }

    .avatar-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      overflow: hidden;
    }

    .main {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 14px 11px 38px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .genres {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .genres::-webkit-scrollbar { display: none; }

    .genre-pill {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }

    .genre-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: var(--accent-glow);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .section-meta {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .popular-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .pop-card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      min-width: 0;
      transition: border-color 0.15s ease;
    }

    .pop-card.playing {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(255,30,110,0.12), var(--surface));
    }

    .art-box {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #0C0C10;
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: var(--accent);
      overflow: hidden;
    }

    .pop-title {
      font-weight: 600;
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .track-row.playing {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .track-text {
      min-width: 0;
      flex: 1;
    }

    .track-name {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-sub {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-btn:active { background: var(--accent-soft); }

    .follow-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .follow-btn.following {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #fff;
    }

    .state-box {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 22px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .state-title { font-weight: 700; font-size: 15px; }
    .state-desc { font-size: 12.5px; color: var(--text-muted); max-width: 300px; }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid var(--accent-soft);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .panel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: block;
    }

    .field-input, .field-select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: var(--accent-glow);
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 9px 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
    }

    .status-local { background: rgba(34, 197, 94, 0.14); color: var(--ok); border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-demo { background: rgba(245, 158, 11, 0.14); color: var(--warn); border: 1px solid rgba(245, 158, 11, 0.3); }

    .mini-player {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 64px;
      width: calc(100% - 20px);
      max-width: 460px;
      background: rgba(18, 18, 22, 0.96);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px 12px 8px;
      z-index: 40;
      box-shadow: 0 10px 30px rgba(0,0,0,0.65);
    }

    .player-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .play-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--accent-glow);
    }

    .progress-wrap {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .progress-bar {
      flex: 1;
      accent-color: var(--accent);
      height: 4px;
      cursor: pointer;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 60px;
      background: rgba(9, 9, 11, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-subtle);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      z-index: 50;
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 2px;
    }

    .nav-item.active { color: var(--accent); }

    .toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: #1C1C22;
      color: #fff;
      border: 1px solid var(--accent);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo-ring" aria-label="NAMU Logo">
          <img src="./public/namu-logo.png" alt="NAMU Logo" class="logo-img" />
        </div>
        <span class="brand-title">NAMU</span>
        <span class="env-badge" id="modeBadge">Local Stable</span>
      </div>
      <div class="top-actions">
        <button class="btn-upload-top" onclick="switchTab('upload')">+ Upload</button>
        <button class="avatar-btn" id="avatarBtn" onclick="switchTab('profile')" title="Profile">
          <img src="./public/namu-logo.png" alt="Profile" class="logo-img" />
        </button>
      </div>
    </header>

    <div id="toast" class="toast"></div>

    <main class="main" id="viewContainer"></main>

    <section class="mini-player" aria-label="Audio Player">
      <div class="player-top">
        <div class="track-info">
          <div class="art-box" id="playerArt"><img src="./public/namu-logo.png" alt="" class="logo-img" /></div>
          <div class="track-text">
            <div class="track-name" id="playerTitle">Eimai</div>
            <div class="track-sub" id="playerArtist">Rr • Pop</div>
          </div>
        </div>
        <div class="player-controls">
          <button class="icon-btn" onclick="prevTrack()" aria-label="Previous">⏮</button>
          <button class="play-circle" id="playPauseBtn" onclick="togglePlay()" aria-label="Play or Pause">▶</button>
          <button class="icon-btn" onclick="nextTrack()" aria-label="Next">⏭</button>
        </div>
      </div>
      <div class="progress-wrap">
        <span id="timeCurrent">0:00</span>
        <input type="range" class="progress-bar" id="seekBar" min="0" max="100" value="0" oninput="seekTrack(this.value)" />
        <span id="timeTotal">3:06</span>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="Main Navigation">
      <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
        <span>⌂</span><span>Home</span>
      </button>
      <button class="nav-item" data-tab="search" onclick="switchTab('search')">
        <span>⌕</span><span>Search</span>
      </button>
      <button class="nav-item" data-tab="library" onclick="switchTab('library')">
        <span>▤</span><span>Library</span>
      </button>
      <button class="nav-item" data-tab="upload" onclick="switchTab('upload')">
        <span>＋</span><span>Upload</span>
      </button>
      <button class="nav-item" data-tab="messages" onclick="switchTab('messages')">
        <span>✉</span><span>Messages</span>
      </button>
      <button class="nav-item" data-tab="profile" onclick="switchTab('profile')">
        <span>●</span><span>Profile</span>
      </button>
    </nav>
  </div>

  <script>
    const STORAGE_KEY = 'namu_stable_v1';

    const DEFAULT_TRACKS = [
      { id: 't1', title: 'Eimai', artist: 'Rr', genre: 'Pop', duration: 186, freq: 220, icon: '◉', following: true, liked: false, source: 'Built-in Synth' },
      { id: 't2', title: 'Glenti', artist: 'Kats', genre: 'Hip-Hop', duration: 164, freq: 261.63, icon: 'ılıl', following: false, liked: false, source: 'Built-in Synth' },
      { id: 't3', title: 'Katabra', artist: 'Kats', genre: 'Rap', duration: 198, freq: 196.00, icon: '♪', following: true, liked: true, source: 'Built-in Synth' },
      { id: 't4', title: 'Den masao', artist: 'NAMU AI', genre: 'Rock', duration: 175, freq: 293.66, icon: '◉', following: false, liked: false, source: 'Built-in Synth' }
    ];

    const DEFAULT_STATE = {
      user: { loggedIn: true, name: 'Ntinos DJ', handle: '@ntinoskats0', role: 'AI Artist & DJ' },
      tracks: DEFAULT_TRACKS,
      messages: [
        { id: 'm1', sender: 'Kats', text: 'Έτοιμο το νέο beat για το Glenti;', time: '14:02' },
        { id: 'm2', sender: 'Rr', text: 'Ανέβασα το Eimai σε καθαρή έκδοση.', time: '14:05' }
      ],
      backendMode: 'local'
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        return { ...DEFAULT_STATE, ...parsed };
      } catch {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    let state = loadState();
    let activeTab = 'home';
    let selectedGenre = 'All';
    let searchQuery = '';
    let uiStatus = 'ready';
    let currentTrackId = state.tracks[0]?.id || null;
    let isPlaying = false;
    let elapsedSec = 0;
    let timerInterval = null;
    let audioCtx = null;
    let oscNode = null;
    let gainNode = null;
    let htmlAudio = new Audio();

    function saveState() {
      try {
        const serializable = {
          ...state,
          tracks: state.tracks.map(t => ({ ...t, audioUrl: undefined }))
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(serializable));
      } catch (e) {
        console.warn('Storage save skipped:', e);
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function formatTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${r < 10 ? '0' : ''}${r}`;
    }

    function stopAudioEngine() {
      clearInterval(timerInterval);
      htmlAudio.pause();
      if (oscNode) {
        try { oscNode.stop(); oscNode.disconnect(); } catch {}
        oscNode = null;
      }
    }

    function startAudioEngine(track) {
      stopAudioEngine();
      if (!track) return;

      if (track.audioUrl) {
        htmlAudio.src = track.audioUrl;
        htmlAudio.currentTime = elapsedSec;
        htmlAudio.play().catch(() => {});
      } else {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!audioCtx) audioCtx = new Ctx();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          oscNode = audioCtx.createOscillator();
          gainNode = audioCtx.createGain();
          oscNode.type = 'triangle';
          oscNode.frequency.setValueAtTime(track.freq || 220, audioCtx.currentTime);
          gainNode.gain.setValueAtTime(0.03, audioCtx.currentTime);
          oscNode.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscNode.start();
        } catch {}
      }

      timerInterval = setInterval(() => {
        elapsedSec += 1;
        if (elapsedSec >= track.duration) {
          nextTrack();
          return;
        }
        updatePlayerUI();
      }, 1000);
    }

    function selectTrack(id, autoPlay = true) {
      const track = state.tracks.find(t => t.id === id);
      if (!track) return;
      currentTrackId = track.id;
      elapsedSec = 0;
      isPlaying = autoPlay;
      if (isPlaying) startAudioEngine(track);
      else stopAudioEngine();
      updatePlayerUI();
      render();
    }

    function togglePlay() {
      const track = state.tracks.find(t => t.id === currentTrackId) || state.tracks[0];
      if (!track) {
        showToast('Δεν υπάρχουν διαθέσιμα κομμάτια');
        return;
      }
      if (!currentTrackId) currentTrackId = track.id;
      isPlaying = !isPlaying;
      if (isPlaying) startAudioEngine(track);
      else stopAudioEngine();
      updatePlayerUI();
    }

    function nextTrack() {
      if (!state.tracks.length) return;
      const idx = state.tracks.findIndex(t => t.id === currentTrackId);
      const next = state.tracks[(idx + 1) % state.tracks.length];
      selectTrack(next.id, true);
    }

    function prevTrack() {
      if (!state.tracks.length) return;
      const idx = state.tracks.findIndex(t => t.id === currentTrackId);
      const prev = state.tracks[(idx - 1 + state.tracks.length) % state.tracks.length];
      selectTrack(prev.id, true);
    }

    function seekTrack(val) {
      const track = state.tracks.find(t => t.id === currentTrackId);
      if (!track) return;
      elapsedSec = Math.floor((Number(val) / 100) * track.duration);
      if (track.audioUrl) htmlAudio.currentTime = elapsedSec;
      updatePlayerUI();
    }

    function updatePlayerUI() {
      const track = state.tracks.find(t => t.id === currentTrackId);
      const titleEl = document.getElementById('playerTitle');
      const artistEl = document.getElementById('playerArtist');
      const playBtn = document.getElementById('playPauseBtn');
      const curEl = document.getElementById('timeCurrent');
      const totEl = document.getElementById('timeTotal');
      const seekEl = document.getElementById('seekBar');

      if (!track) {
        titleEl.textContent = 'Select a track';
        artistEl.textContent = 'NAMU Edition';
        playBtn.textContent = '▶';
        curEl.textContent = '0:00';
        totEl.textContent = '0:00';
        seekEl.value = 0;
        return;
      }

      titleEl.textContent = track.title;
      artistEl.textContent = `${track.artist} • ${track.genre}`;
      playBtn.textContent = isPlaying ? '❚❚' : '▶';
      curEl.textContent = formatTime(elapsedSec);
      totEl.textContent = formatTime(track.duration);
      seekEl.value = track.duration ? Math.min(100, Math.round((elapsedSec / track.duration) * 100)) : 0;
    }

    function toggleFollow(id, e) {
      e.stopPropagation();
      const t = state.tracks.find(x => x.id === id);
      if (!t) return;
      t.following = !t.following;
      saveState();
      showToast(t.following ? `Following ${t.artist}` : `Unfollowed ${t.artist}`);
      render();
    }

    function toggleLike(id, e) {
      e.stopPropagation();
      const t = state.tracks.find(x => x.id === id);
      if (!t) return;
      t.liked = !t.liked;
      saveState();
      showToast(t.liked ? 'Προστέθηκε στα αγαπημένα' : 'Αφαιρέθηκε από τα αγαπημένα');
      render();
    }

    function deleteTrack(id, e) {
      e.stopPropagation();
      const t = state.tracks.find(x => x.id === id);
      if (!t) return;
      state.tracks = state.tracks.filter(x => x.id !== id);
      if (currentTrackId === id) {
        stopAudioEngine();
        isPlaying = false;
        currentTrackId = state.tracks[0]?.id || null;
      }
      saveState();
      updatePlayerUI();
      showToast(`Διαγράφηκε: ${t.title}`);
      render();
    }

    function handleUpload(e) {
      e.preventDefault();
      const title = document.getElementById('upTitle').value.trim();
      const artist = document.getElementById('upArtist').value.trim() || state.user.name;
      const genre = document.getElementById('upGenre').value;
      const fileInput = document.getElementById('upFile');
      const file = fileInput.files[0];

      if (!title) {
        showToast('Γράψε τίτλο κομματιού');
        return;
      }

      const newTrack = {
        id: 't_' + Date.now(),
        title,
        artist,
        genre,
        duration: 180,
        freq: 246.94,
        icon: file ? 'ılıl' : '♪',
        following: true,
        liked: false,
        source: file ? `Local File (${file.name})` : 'Local Entry',
        audioUrl: file ? URL.createObjectURL(file) : undefined
      };

      if (file && newTrack.audioUrl) {
        const probe = new Audio(newTrack.audioUrl);
        probe.addEventListener('loadedmetadata', () => {
          if (probe.duration && isFinite(probe.duration)) {
            newTrack.duration = Math.round(probe.duration);
            updatePlayerUI();
          }
        });
      }

      state.tracks.unshift(newTrack);
      saveState();
      showToast(`Ανέβηκε: ${title}`);
      switchTab('home');
      selectTrack(newTrack.id, true);
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const txt = input.value.trim();
      if (!txt) return;
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      state.messages.push({ id: 'm_' + Date.now(), sender: state.user.name, text: txt, time: `${hh}:${mm}` });
      saveState();
      render();
    }

    function resetToBackup() {
      localStorage.removeItem(STORAGE_KEY);
      stopAudioEngine();
      isPlaying = false;
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      currentTrackId = state.tracks[0].id;
      elapsedSec = 0;
      updatePlayerUI();
      showToast('Επαναφορά καθαρού backup ολοκληρώθηκε');
      render();
    }

    function simulateState(mode) {
      uiStatus = mode;
      render();
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      render();
    }

    function getFilteredTracks() {
      return state.tracks.filter(t => {
        const matchGenre = selectedGenre === 'All' || t.genre === selectedGenre;
        const q = searchQuery.toLowerCase();
        const matchQuery = !q || t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q) || t.genre.toLowerCase().includes(q);
        return matchGenre && matchQuery;
      });
    }

    function renderTrackRow(t) {
      const playing = t.id === currentTrackId;
      return `
        <div class="track-row ${playing ? 'playing' : ''}" onclick="selectTrack('${t.id}', true)">
          <div class="track-info">
            <div class="art-box"><img src="./public/namu-logo.png" alt="" class="logo-img" /></div>
            <div class="track-text">
              <div class="track-name">${t.title}</div>
              <div class="track-sub">${t.artist} • ${t.genre}</div>
            </div>
          </div>
          <div class="track-actions">
            <button class="icon-btn" onclick="deleteTrack('${t.id}', event)" title="Διαγραφή">🗑</button>
            <button class="follow-btn ${t.following ? 'following' : ''}" onclick="toggleFollow('${t.id}', event)">
              ${t.following ? '✓ Following' : '+ Follow'}
            </button>
            <button class="icon-btn" onclick="toggleLike('${t.id}', event)" title="Like">
              ${t.liked ? '♥' : '♡'}
            </button>
            <button class="icon-btn" title="Play">▶</button>
          </div>
        </div>
      `;
    }

    function renderHome() {
      const genres = ['All', 'Pop', 'Hip-Hop', 'Rap', 'Rock'];
      const filtered = getFilteredTracks();
      const popular = state.tracks.slice(0, 4);

      if (uiStatus === 'loading') {
        return `
          <div class="state-box">
            <div class="spinner"></div>
            <div class="state-title">Φόρτωση κομματιών NAMU...</div>
            <div class="state-desc">Έλεγχος τοπικής βάσης και αναπαραγωγής.</div>
          </div>
        `;
      }

      if (uiStatus === 'error') {
        return `
          <div class="state-box">
            <div class="state-title">Σφάλμα σύνδεσης δεδομένων</div>
            <div class="state-desc">Η εξωτερική βάση δεν αποκρίθηκε. Μπορείς να επαναφέρεις άμεσα τη σταθερή τοπική προβολή.</div>
            <button class="btn-primary" onclick="simulateState('ready')">Επαναφορά Προβολής</button>
          </div>
        `;
      }

      return `
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input class="search-input" type="search" placeholder="Search tracks, artist, or genre..." value="${searchQuery}" oninput="searchQuery=this.value; render();" />
        </div>

        <div class="genres">
          ${genres.map(g => `<button class="genre-pill ${selectedGenre === g ? 'active' : ''}" onclick="selectedGenre='${g}'; render();">${g}</button>`).join('')}
        </div>

        <section>
          <div class="section-head">
            <h2 class="section-title">Popular Tracks</h2>
            <span class="section-meta">${popular.length} tracks</span>
          </div>
          ${popular.length ? `
            <div class="popular-grid">
              ${popular.map(t => `
                <div class="pop-card ${t.id === currentTrackId ? 'playing' : ''}" onclick="selectTrack('${t.id}', true)">
                  <div class="art-box"><img src="./public/namu-logo.png" alt="" class="logo-img" /></div>
                  <div class="pop-title">${t.title}</div>
                </div>
              `).join('')}
            </div>
          ` : `<div class="state-box"><div class="state-title">Κανένα δημοφιλές κομμάτι</div></div>`}
        </section>

        <section>
          <div class="section-head">
            <h2 class="section-title">New Releases</h2>
            <span class="section-meta">${filtered.length} εμφανίζονται</span>
          </div>
          ${filtered.length ? `
            <div class="track-list">${filtered.map(renderTrackRow).join('')}</div>
          ` : `
            <div class="state-box">
              <div class="state-title">Δεν βρέθηκαν κομμάτια</div>
              <div class="state-desc">Δοκίμασε άλλο φίλτρο είδους ή ανέβασε νέο κομμάτι από το + Upload.</div>
              <button class="btn-secondary" onclick="selectedGenre='All'; searchQuery=''; render();">Καθαρισμός φίλτρων</button>
            </div>
          `}
        </section>
      `;
    }

    function renderSearch() {
      const filtered = getFilteredTracks();
      return `
        <div class="section-head">
          <h2 class="section-title">Search Catalog</h2>
          <span class="status-pill status-local">● Live Filter</span>
        </div>
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input class="search-input" type="search" placeholder="Αναζήτηση τίτλου, καλλιτέχνη ή είδους..." value="${searchQuery}" oninput="searchQuery=this.value; render();" />
        </div>
        <div class="track-list">
          ${filtered.length ? filtered.map(renderTrackRow).join('') : `
            <div class="state-box">
              <div class="state-title">Κανένα αποτέλεσμα για "${searchQuery}"</div>
              <div class="state-desc">Έλεγξε την ορθογραφία ή δοκίμασε γενικότερο όρο.</div>
            </div>
          `}
        </div>
      `;
    }

    function renderLibrary() {
      const liked = state.tracks.filter(t => t.liked);
      const followed = state.tracks.filter(t => t.following);
      return `
        <div class="section-head">
          <h2 class="section-title">Your Library</h2>
          <span class="status-pill status-local">● Local Storage</span>
        </div>
        <div class="panel-card">
          <strong>Αγαπημένα Κομμάτια (${liked.length})</strong>
          ${liked.length ? `<div class="track-list">${liked.map(renderTrackRow).join('')}</div>` : `<div class="state-desc">Πάτησε την καρδιά (♡) σε οποιοδήποτε κομμάτι για να αποθηκευτεί εδώ.</div>`}
        </div>
        <div class="panel-card">
          <strong>Following Artists (${followed.length})</strong>
          ${followed.length ? `<div class="track-list">${followed.map(renderTrackRow).join('')}</div>` : `<div class="state-desc">Δεν ακολουθείς ακόμα κάποιον δημιουργό.</div>`}
        </div>
      `;
    }

    function renderUpload() {
      return `
        <div class="section-head">
          <h2 class="section-title">Upload Track</h2>
          <span class="status-pill status-local">● Real Audio Support</span>
        </div>
        <form class="panel-card" onsubmit="handleUpload(event)">
          <div>
            <label class="field-label" for="upTitle">Τίτλος Κομματιού *</label>
            <input class="field-input" id="upTitle" required placeholder="π.χ. Night Drive AI" />
          </div>
          <div>
            <label class="field-label" for="upArtist">Καλλιτέχνης / DJ</label>
            <input class="field-input" id="upArtist" value="${state.user.name}" />
          </div>
          <div>
            <label class="field-label" for="upGenre">Είδος (Genre)</label>
            <select class="field-select" id="upGenre">
              <option value="Pop">Pop</option>
              <option value="Hip-Hop">Hip-Hop</option>
              <option value="Rap">Rap</option>
              <option value="Rock">Rock</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="upFile">Αρχείο Ήχου (.mp3 / .wav - προαιρετικό)</label>
            <input class="field-input" id="upFile" type="file" accept="audio/*" />
          </div>
          <button class="btn-primary" type="submit">Δημοσίευση στη Λίστα</button>
        </form>
      `;
    }

    function renderMessages() {
      return `
        <div class="section-head">
          <h2 class="section-title">Messages</h2>
          <span class="status-pill status-demo">◐ Local Demo Chat</span>
        </div>
        <div class="panel-card">
          <div class="state-desc">Τα μηνύματα αποθηκεύονται τοπικά στη συσκευή (όχι σε εξωτερικό server) ώστε να μην κολλάει ποτέ η οθόνη.</div>
          <div style="display:flex; flex-direction:column; gap:8px; max-height:260px; overflow-y:auto;">
            ${state.messages.map(m => `
              <div style="background:var(--surface-2); padding:10px 12px; border-radius:12px; border:1px solid var(--border-subtle);">
                <div style="display:flex; justify-content:space-between; font-size:11.5px; color:var(--accent); font-weight:700;">
                  <span>${m.sender}</span><span style="color:var(--text-muted);">${m.time}</span>
                </div>
                <div style="margin-top:4px; font-size:13.5px;">${m.text}</div>
              </div>
            `).join('')}
          </div>
          <form style="display:flex; gap:8px;" onsubmit="sendMessage(event)">
            <input class="field-input" id="msgInput" placeholder="Γράψε μήνυμα..." />
            <button class="btn-primary" type="submit">Send</button>
          </form>
        </div>
      `;
    }

    function renderProfile() {
      return `
        <div class="section-head">
          <h2 class="section-title">Profile & Architecture</h2>
          <span class="status-pill status-local">● Stable v1.1</span>
        </div>
        <div class="panel-card">
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="avatar-btn" style="width:48px; height:48px;"><img src="./public/namu-logo.png" alt="DJ" class="logo-img" /></div>
            <div>
              <div style="font-weight:800; font-size:16px;">${state.user.name}</div>
              <div style="font-size:12.5px; color:var(--text-muted);">${state.user.handle} • ${state.user.role}</div>
            </div>
          </div>
          <div style="font-size:12.5px; color:var(--text-muted); line-height:1.5;">
            <strong>Όρια Λειτουργιών (Clear Boundaries):</strong><br/>
            • <strong>Πραγματικό:</strong> Audio Player (MP3/WAV & Synth), Αναζήτηση, Φίλτρα, Like/Follow, Προσθήκη/Διαγραφή κομματιών με τοπικό backup.<br/>
            • <strong>Local / Demo:</strong> Chat μηνυμάτων & προφίλ χωρίς εξάρτηση από εξωτερικό Supabase auth ώστε να μη «νεκρώνει» η εφαρμογή.
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            <button class="btn-secondary" onclick="simulateState('loading')">Δοκιμή Loading State</button>
            <button class="btn-secondary" onclick="simulateState('error')">Δοκιμή Error State</button>
            <button class="btn-secondary" onclick="simulateState('ready')">Normal State</button>
          </div>
          <button class="btn-primary" onclick="resetToBackup()">Επαναφορά Αρχικού Καθαρού Backup</button>
        </div>
      `;
    }

    function render() {
      const container = document.getElementById('viewContainer');
      if (activeTab === 'home') container.innerHTML = renderHome();
      else if (activeTab === 'search') container.innerHTML = renderSearch();
      else if (activeTab === 'library') container.innerHTML = renderLibrary();
      else if (activeTab === 'upload') container.innerHTML = renderUpload();
      else if (activeTab === 'messages') container.innerHTML = renderMessages();
      else if (activeTab === 'profile') container.innerHTML = renderProfile();
    }

    updatePlayerUI();
    render();
  </script>
</body>
</html>
